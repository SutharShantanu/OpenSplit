<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join on OpenSplit</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f9faef; color: #1a1c16; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #12140e; color: #e2e3d8; } }
    main { padding: 24px; max-width: 420px; }
    a.btn { display: inline-block; margin: 8px; padding: 14px 24px; border-radius: 999px; background: #4c662b; color: #fff; text-decoration: none; font-weight: 600; }
    a.alt { background: transparent; color: inherit; border: 1px solid currentColor; }
    p { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Opening OpenSplit…</h1>
    <p>If nothing happens, open the invite in the app, or install OpenSplit first and tap the link again.</p>
    <a class="btn" id="open" href="#">Open in app</a>
    <a class="btn alt" id="get" href="https://github.com/SutharShantanu/OpenSplit/releases/latest">Download OpenSplit</a>
  </main>
  <script>
    // Invite links (/join/<token>, /friend/<token>) normally open the app directly via App Links.
    // Landing here means the app isn't installed (or the link opened in a browser): on Android, try the
    // app once and fall back to the latest GitHub release; elsewhere, go straight to the release page.
    var RELEASE = "https://github.com/SutharShantanu/OpenSplit/releases/latest";
    var intent = "intent://" + location.host + location.pathname + location.search +
      "#Intent;scheme=https;package=open.split_07;S.browser_fallback_url=" + encodeURIComponent(RELEASE) + ";end";
    document.getElementById("open").href = /Android/i.test(navigator.userAgent) ? intent : RELEASE;
    location.replace(/Android/i.test(navigator.userAgent) ? intent : RELEASE);
  </script>
</body>
</html>
