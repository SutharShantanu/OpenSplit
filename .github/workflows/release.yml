name: Publish Release

on:
  push:
    tags:
      - 'v*'
  # Auto-release: every successful "Build Debug APK" run on main publishes
  # a versioned release tagged v<versionName>.<run_number>.
  workflow_run:
    workflows: [ "Build Debug APK" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.4.1)'
        required: true
        default: 'v2.4.1'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Determine release version
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION_NAME=$(grep -oP 'val baseVersion = "\K[^"]+' app/build.gradle.kts)
            TAG="v${VERSION_NAME}.${{ github.event.workflow_run.run_number }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Provide google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
            echo "Using production GOOGLE_SERVICES_JSON secret."
          else
            cp .github/google-services.debug.json app/google-services.json
            echo "No GOOGLE_SERVICES_JSON secret set — using debug placeholder."
          fi

      - name: Provide .env and GEMINI_API_KEY
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
            echo "GEMINI_API_KEY=\"${{ secrets.GEMINI_API_KEY }}\"" > .env
          else
            echo "GEMINI_API_KEY=" >> $GITHUB_ENV
            echo 'GEMINI_API_KEY=""' > .env
          fi

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "Using repository release keystore."
          else
            # Fall back to the stable debug keystore (same SHA-1 registered in Firebase).
            if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "No RELEASE_KEYSTORE_BASE64 set — signing with debug keystore."
          fi

      - name: Build Release APK and App Bundle
        env:
          # Same number the debug build of this commit used, so nightly N == release v1.0.N.
          VERSION_CODE: ${{ github.event.workflow_run.run_number || github.run_number }}
          VERSION_NAME: ${{ env.VERSION }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          APK_NAME="OpenSplit-${TAG}.apk"
          AAB_NAME="OpenSplit-${TAG}.aab"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/${APK_NAME}"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/${AAB_NAME}"
          cd release-artifacts
          sha256sum "${APK_NAME}" "${AAB_NAME}" > checksums.txt
          cat checksums.txt

      - name: Upload Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: opensplit-release-${{ env.TAG }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: OpenSplit ${{ env.TAG }}
          body: |
            ## OpenSplit ${{ env.TAG }}
            
            ### 📦 Download Assets
            | Asset | Description |
            | :--- | :--- |
            | **[OpenSplit-${{ env.TAG }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/OpenSplit-${{ env.TAG }}.apk)** | Standalone Android APK (Direct install) |
            | **[OpenSplit-${{ env.TAG }}.aab](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/OpenSplit-${{ env.TAG }}.aab)** | Android App Bundle (Google Play Store) |
            | **checksums.txt** | SHA-256 integrity checksums |
            
            ### 🚀 Quick Install (ADB)
            ```bash
            adb install -r OpenSplit-${{ env.TAG }}.apk
            ```
            
            ### 🔒 Integrity Check
            ```bash
            sha256sum -c checksums.txt
            ```
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-artifacts/*
