name: Build Debug APK

# Builds an installable debug APK on every push to main (and on demand) and
# uploads it as a downloadable artifact — no local Gradle/SDK required.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Provide google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            # Real Firebase config from a repo secret (base64-encoded).
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
            echo "Using GOOGLE_SERVICES_JSON secret."
          else
            # CI placeholder so the build succeeds; Firebase calls won't work at runtime.
            cp .github/google-services.debug.json app/google-services.json
            echo "No GOOGLE_SERVICES_JSON secret set — using placeholder (UI-testable, Firebase disabled)."
          fi

      - name: Generate debug keystore
        run: |
          # The debug signing config points at ${rootDir}/debug.keystore (git-ignored).
          # Recreate it with the standard Android debug credentials so signing succeeds.
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenSplit-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensplit-debug-apk
          path: OpenSplit-debug.apk
          if-no-files-found: error

      # Publish to a rolling "nightly" Release so there's a permanent download URL:
      # https://github.com/SutharShantanu/OpenSplit/releases/download/nightly/OpenSplit-debug.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: OpenSplit — latest debug build
          body: |
            Automated **debug** APK from the latest commit on `main`.

            Install:
            ```
            adb install -r OpenSplit-debug.apk
            ```
            Note: built with a placeholder Firebase config unless the
            `GOOGLE_SERVICES_JSON` secret is set, so sign-in/sync may not work.
          prerelease: true
          files: OpenSplit-debug.apk
