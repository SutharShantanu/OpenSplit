name: Build Debug APK

# Builds an installable debug APK on every push to main (and on demand) and
# uploads it as a downloadable artifact — no local Gradle/SDK required.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Provide google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            # Real Firebase config from a repo secret (base64-encoded).
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
            echo "Using GOOGLE_SERVICES_JSON secret."
          else
            # CI placeholder so the build succeeds; Firebase calls won't work at runtime.
            cp .github/google-services.debug.json app/google-services.json
            echo "No GOOGLE_SERVICES_JSON secret set — using placeholder (UI-testable, Firebase disabled)."
          fi

      - name: Provide .env and GEMINI_API_KEY
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
            echo "GEMINI_API_KEY=\"${{ secrets.GEMINI_API_KEY }}\"" > .env
            echo "Using GEMINI_API_KEY secret."
          else
            echo "GEMINI_API_KEY=" >> $GITHUB_ENV
            echo 'GEMINI_API_KEY=""' > .env
            echo "No GEMINI_API_KEY secret set — using empty string."
          fi

      - name: Provide debug keystore
        run: |
          # The debug signing config points at ${rootDir}/debug.keystore (git-ignored).
          # Use the stable keystore from the DEBUG_KEYSTORE_BASE64 secret so the APK's
          # SHA-1 matches the one registered in Firebase (Google Sign-In needs this).
          # Without the secret a throwaway keystore is generated and sign-in won't work.
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
            echo "Using DEBUG_KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "No DEBUG_KEYSTORE_BASE64 secret set — generated throwaway keystore (Google Sign-In disabled)."
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenSplit.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensplit-debug-apk
          path: OpenSplit.apk
          if-no-files-found: error

      # Publish to a rolling "nightly" Release so there's a permanent download URL:
      # https://github.com/SutharShantanu/OpenSplit/releases/download/nightly/OpenSplit.apk
      # Delete first so the release date and the `nightly` tag track the current
      # commit; softprops only swaps assets on an existing release.
      - name: Reset nightly release
        if: github.ref == 'refs/heads/main'
        run: gh release delete nightly --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: OpenSplit — latest debug build
          body: |
            Automated **debug** APK from the latest commit on `main`.

            Install:
            ```
            adb install -r OpenSplit.apk
            ```
            Note: built with a placeholder Firebase config unless the
            `GOOGLE_SERVICES_JSON` secret is set, so sign-in/sync may not work.
          prerelease: true
          files: OpenSplit.apk
