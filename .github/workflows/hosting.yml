# Deploys the invite-link landing page and assetlinks.json (hosting/) to Firebase Hosting at
# https://opensplit-fe83f.firebaseapp.com. Hosting is free on the Spark plan.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT: the JSON key of a service account with the
# "Firebase Hosting Admin" role (Google Cloud Console > IAM > Service accounts).
name: Deploy hosting

on:
  push:
    branches: [main]
    paths:
      - "hosting/**"
      - "firebase.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: opensplit-fe83f
